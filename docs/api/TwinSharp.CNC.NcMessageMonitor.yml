    startLine: 17
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Monitors NC-program messages sent to the PLC via <code>#MSG PLC "text"</code> or

    <code>#MSGINFO PLC "text"</code> in the NC program.

    <p>

    When the CNC places a message in the HLI <code>msg_mc_control</code> control unit, this class

    fires <xref href="TwinSharp.CNC.NcMessageMonitor.MessageReceived" data-throw-if-not-resolved="false"></xref> with the message text and type, then acknowledges the

    semaphore so the CNC can deliver the next message.

    </p><p>

    Call <xref href="TwinSharp.CNC.NcMessageMonitor.Enable" data-throw-if-not-resolved="false"></xref> once after connecting to register the PLC as present on this

    control unit. Without it the CNC will not deliver messages.

    </p>
  example: []
  syntax:
    content: 'public class NcMessageMonitor : IDisposable'
    content.vb: Public Class NcMessageMonitor Implements IDisposable
