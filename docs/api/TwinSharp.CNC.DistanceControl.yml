    id: DistanceControl
    path: ../TwinSharp/CNC/DistanceControl.cs
    startLine: 24
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Wraps the TF5200 distance control HLI for a single CNC axis.

    Allows enabling the interface, issuing commands (activate/freeze/deactivate),

    and reading state and position feedback via ADS variable handles.


    Two activation modes are supported:

    <ul><li><b>SET_POS mode</b> (<xref href="TwinSharp.CNC.DistanceControl.ActivateSetPos(System.Double)" data-throw-if-not-resolved="false"></xref>): the CNC adjusts the axis
      to hold the workpiece surface at a commanded absolute position.</li><li><b>Constant-distance mode</b> (<xref href="TwinSharp.CNC.DistanceControl.ActivateConstDistance(System.Double)" data-throw-if-not-resolved="false"></xref>): the CNC
      maintains a fixed gap between tool and workpiece surface.</li></ul>

    The sensor must be wired as Encoder 2 on the axis and configured in TwinCAT.

    Parameter P-AXIS-00328 must be set to enable the distance control function globally for the axis.


    Semaphore handshake: after writing a command, <code>command_semaphor_rw</code> is set to <code>true</code>.

    The CNC clears it back to <code>false</code> once the command is latched. In debug contexts it is

    acceptable not to wait for clearance before issuing the next command.
  example: []
  syntax:
    content: 'public class DistanceControl : IDisposable'
    content.vb: Public Class DistanceControl Implements IDisposable
