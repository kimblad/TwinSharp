    path: ../TwinSharp/CNC/AxisCoupling.cs
    startLine: 27
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Wraps the HLI axis coupling interface for a single CNC axis

    (<code>gpAx[n].lr_mc_control.axis_coupling</code>).


    Axis coupling (electronic gearing) makes a target axis follow one or more source axes

    according to a specified coupling factor.  Typical uses include tandem/gantry axes and

    secondary cutting heads (MultiJet).


    <p><b>Precondition:</b> all involved axes must be at standstill (velocity = 0) before calling

    <xref href="TwinSharp.CNC.AxisCoupling.SetCouplings(TwinSharp.CNC.AxisCouplingEntry%5b%5d)" data-throw-if-not-resolved="false"></xref> or <xref href="TwinSharp.CNC.AxisCoupling.RemoveCouplings" data-throw-if-not-resolved="false"></xref>.  The CNC will raise error 70200

    if this is violated.

    </p><p><b>NC programmability:</b> if the coupled target axis also needs to respond to motion

    commands in the NC program, include a self-coupling entry in the descriptor list

    (source axis = target axis, mode = <xref href="TwinSharp.CNC.AxisCouplingMode.Direct" data-throw-if-not-resolved="false"></xref>).

    </p>


    Semaphore handshake: after writing descriptors, <code>semaphor_rw</code> is set to <code>true</code>.

    The CNC latches the command and clears the semaphore automatically.
  example: []
