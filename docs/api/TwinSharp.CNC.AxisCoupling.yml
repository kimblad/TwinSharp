      repo: https://github.com/kimblad/TwinSharp.git
    id: SetCouplings
    path: ../TwinSharp/CNC/AxisCoupling.cs
    startLine: 90
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Activates axis coupling with the specified descriptor list.

    Writes each entry's fields, writes <xref href="TwinSharp.CNC.AxisCouplingMode.Inactive" data-throw-if-not-resolved="false"></xref> as the

    terminator immediately after the last entry, then pulses the semaphore.
  example: []
  syntax:
    content: public void SetCouplings(AxisCouplingEntry[] specs)
    parameters:
    - id: specs
      type: TwinSharp.CNC.AxisCouplingEntry[]
      description: >-
        Ordered list of coupling descriptors. Must not exceed

        <xref href="TwinSharp.CNC.HliConstants.HLI_AX_COUPLING_MAXIDX" data-throw-if-not-resolved="false"></xref> + 1 entries (= 4).
    content.vb: Public Sub SetCouplings(specs As AxisCouplingEntry())
  overload: TwinSharp.CNC.AxisCoupling.SetCouplings*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Thrown when <code class="paramref">specs</code> has more than 4 entries (no room for the terminator).
