  namespace: TwinSharp.CNC
  summary: >-
    Provides read-only access to the real-time status of the CNC path interpolator

    via the HLI <code>bahn_state</code> variable (<code>STATE_BAHN</code> struct).

    <p>

    All data is read in a single ADS call by accessing the entire <xref href="TwinSharp.CNC.StateBahn" data-throw-if-not-resolved="false"></xref>

    struct via <xref href="TwinSharp.CNC.RealTimeStatus.State" data-throw-if-not-resolved="false"></xref>.

    </p>
