    id: InsertAtRelativeDistance
    path: ../TwinSharp/CNC/InsertStopCommand.cs
    startLine: 80
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Inserts a one-shot M00 stop after the CNC's path interpolator has traveled

    <code class="paramref">remainingMm</code> more mm from its current position.

    Uses DISTANCE mode (<code>axis_nr = 0</code>) with <code>rel_abs_mode = 2</code>

    (one-off relative distance from the current interpolator position).
  example: []
  syntax:
    content: public void InsertAtRelativeDistance(double remainingMm)
    parameters:
    - id: remainingMm
      type: System.Double
      description: Distance to travel before stopping, in mm.
    content.vb: Public Sub InsertAtRelativeDistance(remainingMm As Double)
