    id: InsertStopCommand
    path: ../TwinSharp/CNC/InsertStopCommand.cs
    startLine: 14
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Allows insertion of CNC stop marks into a running NC program at runtime via the HLI

    <code>bahn_mc_control.insert_cmd</code> control unit.

    <p>

    In POSITION mode (logicalAxisNumber &gt; 0 in <xref href="TwinSharp.CNC.InsertStopCommand.InsertAtPosition(System.Double%2cSystem.UInt32)" data-throw-if-not-resolved="false"></xref>) the CNC

    stops the first time the specified axis reaches the commanded position. The stop behaves

    like M00 — the operator presses Continue to resume.

    </p><p>Requires <code>P-STUP-00033</code> (fb_storage_size) to be non-zero on the machine.</p>
  example: []
  syntax:
    content: 'public class InsertStopCommand : IDisposable'
    content.vb: Public Class InsertStopCommand Implements IDisposable
