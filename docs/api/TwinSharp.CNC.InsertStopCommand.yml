  source:
    remote:
      path: TwinSharp/CNC/InsertStopCommand.cs
      branch: main
      repo: https://github.com/kimblad/TwinSharp.git
    id: InsertAtPosition
    path: ../TwinSharp/CNC/InsertStopCommand.cs
    startLine: 57
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Inserts a one-shot absolute stop (M00) the first time <code class="paramref">logicalAxisNumber</code>

    reaches <code class="paramref">positionMm</code>. If the program is already past that position the

    stop is triggered immediately.
  example: []
  syntax:
    content: public void InsertAtPosition(double positionMm, uint logicalAxisNumber)
    parameters:
    - id: positionMm
      type: System.Double
      description: Target axis position in mm.
    - id: logicalAxisNumber
      type: System.UInt32
      description: >-
        Logical axis number (&gt; 0). Use the X-axis logical
            number for a marker-based stop.
    content.vb: Public Sub InsertAtPosition(positionMm As Double, logicalAxisNumber As UInteger)
