    id: AxisControlCommands
    path: ../TwinSharp/CNC/AxisControlCommands.cs
    startLine: 34
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Wraps the axis control commands of the HLI <code>lr_mc_control</code> control unit for a single CNC axis

    (<code>gpAx[n].lr_mc_control.*</code>), as described in section "Axis control commands" of the HLI documentation.


    <p>

    Every command in this class is an MC control unit with four elements:

    <ul><li><code>enable_w</code> — the PLC declares that it uses this control unit.
      <b>The unit has no effect at all until this is TRUE</b>, so call the matching
      <code>...Enable</code> setter (or <xref href="TwinSharp.CNC.AxisControlCommands.EnableAll" data-throw-if-not-resolved="false"></xref>) once after connecting.</li><li><code>command_w</code> — the value commanded by the PLC.</li><li><code>request_r</code> — the value requested by a GUI communicating directly with the CNC.
      The PLC may accept the request by copying it into <code>command_w</code>, or ignore it.</li><li><code>state_r</code> — the CNC acknowledgement, used to check whether the command took effect.</li></ul></p><p>
    Other parts of <code>lr_mc_control</code> live in their own classes:

    <xref href="TwinSharp.CNC.AxisCoupling" data-throw-if-not-resolved="false"></xref> (<code>axis_coupling</code>), <xref href="TwinSharp.CNC.DistanceControl" data-throw-if-not-resolved="false"></xref> (<code>distance_control</code>)

    and <xref href="TwinSharp.CNC.ExternalAxisCommanding" data-throw-if-not-resolved="false"></xref> (<code>add_cmd_values</code>).

    The axis control commands that sit under <code>ipo_mc_control</code> (feedhold, override, reduced velocity, …)

    are not part of this class.

    </p><p><b>Precondition:</b><xref href="TwinSharp.CNC.CncAxis.PlcPresent" data-throw-if-not-resolved="false"></xref> must be set to <code>true</code> before the CNC

    accepts any HLI command for the axis.

    </p>
