    <code>true</code> = reference cam switched, <code>false</code> = reference cam not switched.

    Only acts if <code>lr_hw[i].cam_direct_access</code> (P-AXIS-00036) is 0 in the axis parameter list.

    <code>lr_hw[i].cam_level</code> (P-AXIS-00038) can invert this from high-active to low-active.

