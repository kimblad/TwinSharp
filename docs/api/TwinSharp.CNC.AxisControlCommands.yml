  namespace: TwinSharp.CNC
  summary: >-
    Accept the reference position and mark the axis as referenced on a <b>rising edge</b>

    (<code>false</code> → <code>true</code>). The value the actual axis position is set to depends on P-AXIS-00278:

    <ul><li><code>ABSOLUT</code> — value of P-AXIS-00152.</li><li><code>OFFSET</code> — drive encoder position + P-AXIS-00279.</li><li><code>PLC</code> — value of <xref href="TwinSharp.CNC.AxisControlCommands.ReferencePositionCommand" data-throw-if-not-resolved="false"></xref>.</li><li><code>PLC_OFFSET</code> — drive encoder position + <xref href="TwinSharp.CNC.AxisControlCommands.ReferencePositionCommand" data-throw-if-not-resolved="false"></xref>.</li></ul>

    Works for axes with an absolute measuring system too.

    Writes <code>set_reference_position.command_w</code>.
