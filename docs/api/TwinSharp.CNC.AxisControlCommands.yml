    id: FeedEnableCommand
    path: ../TwinSharp/CNC/AxisControlCommands.cs
    startLine: 119
  assemblies:
  - TwinSharp
  namespace: TwinSharp.CNC
  summary: >-
    Axis-specific feed rate enable. Must be set for every axis that is to be moved,

    otherwise no path motion occurs.

    <code>true</code> = drive enable, <code>false</code> = drive STOP. On a <code>true</code> → <code>false</code> transition

    the drive is shut down in compliance with the acceleration parameters.

    With SERCOS drives this is derived from bit 13 of the control word.

    Writes <code>release_feedhold.command_w</code>.
  example: []
  syntax:
    content: public bool FeedEnableCommand { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property FeedEnableCommand As Boolean
